<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc">
<title id="title">Tres muestras con el setenta por ciento de caras: menos incertidumbre al aumentar n</title>
<desc id="desc">Gráficos Beta posteriores de n igual a 10, 100 y 1000. La media pasa de 0,6429 a 0,6923 y 0,6992, mientras la desviación típica desciende de 0,1237 a 0,0450 y 0,0145. Las tres curvas se reescalan verticalmente para comparar su anchura, no su altura.</desc>
<rect width="1100" height="550" fill="#f6f9fc" rx="25"/>
<text x="46" y="52" font-size="30" font-family="system-ui,sans-serif" font-weight="800" fill="#14273c">Misma proporción. Distinta precisión.</text>
<text x="46" y="82" font-size="17" font-family="system-ui,sans-serif" fill="#40576c">Priori Beta(2,2) · 70 % de caras en los tres experimentos</text>
